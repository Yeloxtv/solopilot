name: Bug report
description: Something solopilot does wrong.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: Vous pouvez écrire en français.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The command you ran and its output. If you can, the smallest solopilot.yaml that shows it, without your client's details.
  - type: input
    id: setup
    attributes:
      label: Your setup
      placeholder: "OS, Node version, solopilot --version, Claude Code version"
