name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Some tests commit in temporary repositories: a runner has no git identity of its own.
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com"
      - run: npm ci
      - run: npm test
