name: Publish

# Stages on npm the version of package.json, through npm's trusted publishing: npm trusts this
# workflow of this repository, so no token is stored anywhere. The trusted publisher is declared
# once in the package settings on npmjs.com (workflow: publish.yml). A staged version goes live only
# once a maintainer approves it, with 2FA, in the Staged Packages tab on npmjs.com, or with
# `npm stage approve <stage-id>`. Two ways to start it:
# - push a tag naming the version, `git tag v0.4.0 && git push origin v0.4.0`;
# - run it by hand on main (Actions > Publish > Run workflow): it tags the version once published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@^11.15.0
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # A tag and package.json must name the same version, or npm would publish another one.
      - if: github.event_name == 'push'
        run: test "v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME"
      # By hand, only from main, and only a version npm does not have yet.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF" = refs/heads/main
          ! npm view "solopilot@${{ steps.version.outputs.version }}" version --silent | grep -q .
      - run: git config --global user.name "CI" && git config --global user.email "ci@example.com"
      - run: npm ci
      - run: npm test
      # Staged, not published: a trusted publisher may stage by default, and the release waits on a person.
      - run: npm stage publish
      # A tag pushed by this workflow starts no other run: the version is not staged twice.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "solopilot ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
