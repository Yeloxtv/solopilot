# Fieldbook, un projet fictif pour essayer solopilot.
#
#   solopilot build --dir examples/demo-fr --today 2026-10-21
#
# Fieldbook est une application mobile d'inspection, développée par un développeur solo, Alex, pour
# Harbor & Pine, une coopérative de gestion de bâtiments. Le plan a été tiré des documents de sources/
# (le cahier des charges, les notes de l'atelier de lancement, le devis et deux maquettes), convenu le
# 25 septembre, et le voici le 21 octobre, à mi-parcours. `solopilot init <dossier> --example --locale fr`
# copie les mêmes documents dans un nouveau dossier de pilotage, pour tirer soi-même le premier plan.
# Tout est inventé.
#
# C'est la version française de examples/demo : mêmes identifiants, mêmes dates, mêmes points, seuls
# les textes changent. Un test vérifie que les deux démos racontent la même histoire.

project:
  name: Fieldbook
  client: Harbor & Pine
  owner: Alex
  locale: fr
  goal: "Mise en ligne"
  start: 2026-09-28
  target: 2026-11-27
  budget_days: 20
  plan_days: 20
  core: 14
  points_per_day: 6.3
  focus: 0.5
  holidays: [2026-11-26]
  baseline: { date: 2026-09-25, points: 126, plan_days: 20 }
  scope_agreed: { by: "Maya Lindqvist", date: 2026-09-25 }

people: ["Alex", "Harbor & Pine", "Équipe design"]

sprints:
  - { id: 1, from: 1, to: 6, title: "API" }
  - { id: 2, from: 7, to: 14, title: "Le cœur en préproduction" }
  - { id: 3, from: 15, to: 20, title: "Administration, suivi, mise en ligne" }

milestones:
  - { day: 5, type: checkpoint, status: reached, reached_on: 2026-10-14, title: "API des inspections terminée" }
  - { day: 10, type: client, status: upcoming, title: "Démo du parcours d'inspection" }
  - { day: 12, type: checkpoint, status: upcoming, title: "Fonctionne hors ligne", criterion: "Sinon, les conflits de synchronisation passent sous la ligne" }
  - { day: 14, type: client, status: upcoming, title: "Cœur en préproduction" }
  - { day: 18, type: checkpoint, status: upcoming, title: "Plus rien de nouveau n'entre" }
  - { day: 20, type: client, status: upcoming, title: "Production et passation" }

meetings:
