# Les tailles convenues avant d'estimer les tâches.
estimation:
  basis: hypotheses
  grid:
    - { kind: screen, size: "2 ou 3 vues simples", points: 2 }
    - { kind: screen, size: "4 ou 5 vues, états hors ligne compris", points: 4 }
    - { kind: logic, size: "un endpoint avec ses règles et ses tests", points: 2 }
    - { kind: logic, size: "une règle transverse (accès, audit, versions)", points: 3 }
    - { kind: integration, size: "un service ou une API de l'appareil (e-mail, caméra, PDF)", points: 3 }
    - { kind: setup, size: "dépôt, CI, modèle de données, design system", points: 2 }
    - { kind: release, size: "un environnement déployé et supervisé", points: 2 }

