  - { id: D02, before: 7, status: waiting, who: "Équipe design", asked_on: 2026-09-22, reminded_on: 2026-10-19, title: "Écrans du parcours d'inspection", tasks: [S04, S05, S06] }
  - { id: D03, before: 11, status: waiting, who: "Harbor & Pine", asked_on: 2026-09-22, title: "Exemples de grilles des trois plus grands sites", tasks: [T020], meeting: "2026-10-23", priority: 4, stake: "De vraies grilles pour tester le stockage hors ligne" }
  - { id: D04, before: 14, status: waiting, who: "Harbor & Pine", title: "Serveur de préproduction, domaine et certificat", tasks: [T029] }

questions:
  - { id: Q01, before: 6, status: open, who: "Harbor & Pine", asked_on: 2026-10-08, title: "Un inspecteur peut-il modifier une inspection après l'avoir soumise ?", tasks: [T014], meeting: "2026-10-23", priority: 1, stake: "Fige le modèle d'inspection avant les écrans" }
  - { id: Q02, before: 2, status: answered, who: "Harbor & Pine", asked_on: 2026-09-22, title: "De quels rôles avons-nous besoin ?", answer: "Inspecteur, responsable et administrateur ; un responsable voit tous les sites de sa région" }
  - { id: Q03, before: 9, status: open, who: "Harbor & Pine", asked_on: 2026-09-22, reminded_on: 2026-10-16, title: "Combien de temps garde-t-on les photos d'inspection ?", tasks: [T015, T022], meeting: "2026-10-23", priority: 2, stake: "Dimensionne le stockage et le cache hors ligne" }
  - { id: Q04, before: 13, status: open, who: "Harbor & Pine", title: "Que doit montrer la première page du rapport PDF ?", tasks: [T026, S07], meeting: "2026-10-23", priority: 3 }
  - { id: Q05, before: 12, status: open, who: "Alex", title: "Quelle modification l'emporte quand deux appareils changent la même inspection hors ligne ?", tasks: [T024] }
  - { id: Q06, before: 5, status: answered, who: "Harbor & Pine", title: "Quelles gravités une constatation peut-elle avoir ?", answer: "Faible, moyenne, élevée et critique ; les constatations critiques d'abord partout (atelier de lancement)", tasks: [T012] }
  - { id: Q07, before: 4, status: answered, who: "Harbor & Pine", title: "Une inspection passée garde-t-elle sa version de grille ?", answer: "Oui, celle avec laquelle elle a été faite : les rapports passés ne changent jamais (atelier de lancement)", tasks: [T010] }

