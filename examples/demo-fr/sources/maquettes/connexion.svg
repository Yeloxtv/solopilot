  <text x="195" y="552" font-size="13" fill="#5e6b66" text-anchor="middle">Sans mot de passe : le lien vaut 15 minutes.</text>
  <text x="195" y="720" font-size="12" fill="#9aa39e" text-anchor="middle">Harbor &amp; Pine · aide : service des bâtiments</text>
