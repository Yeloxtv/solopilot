  - { id: F08, area: offline, core: true, priority: 7, source: "spec.md §6", title: "A whole day of inspections without network" }
  - { id: F09, area: reports, core: true, priority: 8, source: "spec.md §7.1", title: "PDF report of each inspection" }
  - { id: F10, area: admin, priority: 9, source: "spec.md §8.1", title: "Checklist editor" }
  - { id: F11, area: admin, priority: 10, source: "spec.md §8.2", title: "Users, invitations and back office" }
