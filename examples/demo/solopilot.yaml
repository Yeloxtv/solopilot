  - { id: F19, area: setup, scope: out, source: "spec.md §10", title: "Other languages than English" }

# The sizes agreed before the tasks were estimated.
estimation:
  basis: hypotheses
  grid:
    - { kind: screen, size: "2 or 3 simple views", points: 2 }
    - { kind: screen, size: "4 or 5 views, offline states included", points: 4 }
    - { kind: logic, size: "an endpoint with its rules and tests", points: 2 }
    - { kind: logic, size: "a rule across the app (access, audit, versions)", points: 3 }
    - { kind: integration, size: "a service or a device API (email, camera, PDF)", points: 3 }
    - { kind: setup, size: "repository, CI, data model, design system", points: 2 }
    - { kind: release, size: "an environment deployed and monitored", points: 2 }

