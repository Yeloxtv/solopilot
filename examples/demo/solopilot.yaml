  - { id: F13, area: reports, priority: 12, source: "spec.md §7.3", title: "CSV export and monthly summary by email" }
  - { id: F14, area: inspections, priority: 13, source: "spec.md §5.4", title: "Reminders of overdue inspections", note: "Nice to have" }
  - { id: F15, area: accounts, priority: 14, source: "spec.md §3.3", title: "Single sign-on with the members' directory", note: "Not needed for the launch" }
  - { id: F16, area: release, scope: out, source: "spec.md §10", title: "Native apps in the app stores" }
