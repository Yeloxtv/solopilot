# Fieldbook, a fictional project to try solopilot.
#
#   solopilot build --dir examples/demo --today 2026-10-21
#
# Fieldbook is a mobile inspection app built by a solo developer, Alex, for Harbor & Pine, a
# facilities cooperative. The plan was drawn up from the documents in sources/ (the spec, the
# kickoff workshop notes, the quote and two mockups), agreed on September 25, and here it stands
# on October 21, mid-way. `solopilot init <dir> --example` copies the same documents into a new
# pilot directory, to draw up the first plan yourself. Everything here is made up.
#
# examples/demo-fr tells the same story in French: same ids, dates and points, only the text
# changes. A test checks that the two demos stay the same story: change them together.

project:
  name: Fieldbook
  client: Harbor & Pine
  owner: Alex
  locale: en
  goal: "Launch"
  start: 2026-09-28
  target: 2026-11-27
  budget_days: 20
  plan_days: 20
  core: 14
  points_per_day: 6.3
  focus: 0.5
  holidays: [2026-11-26]
  baseline: { date: 2026-09-25, points: 126, plan_days: 20 }
  scope_agreed: { by: "Maya Lindqvist", date: 2026-09-25 }

people: ["Alex", "Harbor & Pine", "Design team"]

sprints:
  - { id: 1, from: 1, to: 6, title: "API" }
  - { id: 2, from: 7, to: 14, title: "The core in staging" }
  - { id: 3, from: 15, to: 20, title: "Admin, insights, launch" }

milestones:
  - { day: 5, type: checkpoint, status: reached, reached_on: 2026-10-14, title: "Inspection API complete" }
  - { day: 10, type: client, status: upcoming, title: "Inspection flow demo" }
  - { day: 12, type: checkpoint, status: upcoming, title: "Works offline", criterion: "Otherwise sync conflicts go below the line" }
  - { day: 14, type: client, status: upcoming, title: "Core in staging" }
  - { day: 18, type: checkpoint, status: upcoming, title: "Nothing new comes in" }
  - { day: 20, type: client, status: upcoming, title: "Production and handover" }

meetings:
  - { date: 2026-10-23, title: "Workshop #2", with: "Harbor & Pine" }

dependencies:
  - { id: D01, before: 3, status: received, who: "Harbor & Pine", asked_on: 2026-09-22, title: "List of sites and buildings", tasks: [T003] }
  - { id: D02, before: 7, status: waiting, who: "Design team", asked_on: 2026-09-22, reminded_on: 2026-10-19, title: "Screens for the inspection flow", tasks: [S04, S05, S06] }
  - { id: D03, before: 11, status: waiting, who: "Harbor & Pine", asked_on: 2026-09-22, title: "Sample checklists from the three largest sites", tasks: [T020], meeting: "2026-10-23", priority: 4, stake: "Real checklists to test offline storage with" }
  - { id: D04, before: 14, status: waiting, who: "Harbor & Pine", title: "Staging server, domain and certificate", tasks: [T029] }

questions:
  - { id: Q01, before: 6, status: open, who: "Harbor & Pine", asked_on: 2026-10-08, title: "Can an inspector edit an inspection after submitting it?", tasks: [T014], meeting: "2026-10-23", priority: 1, stake: "Locks the inspection model before the screens start" }
  - { id: Q02, before: 2, status: answered, who: "Harbor & Pine", asked_on: 2026-09-22, title: "Which roles do we need?", answer: "Inspector, manager and admin; a manager sees every site of their region" }
  - { id: Q03, before: 9, status: open, who: "Harbor & Pine", asked_on: 2026-09-22, reminded_on: 2026-10-16, title: "How long do we keep inspection photos?", tasks: [T015, T022], meeting: "2026-10-23", priority: 2, stake: "Sizes storage and the offline cache" }
  - { id: Q04, before: 13, status: open, who: "Harbor & Pine", title: "What must page one of the PDF report show?", tasks: [T026, S07], meeting: "2026-10-23", priority: 3 }
  - { id: Q05, before: 12, status: open, who: "Alex", title: "Which edit wins when two devices change the same inspection offline?", tasks: [T024] }
  - { id: Q06, before: 5, status: answered, who: "Harbor & Pine", title: "Which severities can a finding have?", answer: "Low, medium, high and critical; critical findings first everywhere (kickoff workshop)", tasks: [T012] }
  - { id: Q07, before: 4, status: answered, who: "Harbor & Pine", title: "Does a past inspection keep its checklist version?", answer: "Yes, the version it was run with: past reports never change (kickoff workshop)", tasks: [T010] }

requests:
  - { id: R01, status: accepted, title: "Signature at the end of an inspection", recommendation: "Accept: half a day on day 10", decision: "Accepted at workshop #1: one signature, drawn on screen", tasks: [T019] }
  - { id: R02, status: pending, before: 8, title: "Map view of sites", recommendation: "Defer: needs a map provider. Sort the list by distance instead" }
  - { id: R03, status: declined, title: "Chat between inspectors", recommendation: "Decline: out of scope", decision: "Declined at workshop #1: email is enough" }

