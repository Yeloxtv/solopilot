# __NAME__, steered with solopilot
#
# The single source of truth. The dashboard and the Slack digest are generated from this file:
# never edit them by hand. The /solopilot skill in Claude Code proposes changes and writes them
# once you approve; you can also edit by hand, then run `solopilot check`.
#
# Keep this file out of the project repository: your client gets the code, not your delays.
# Only task ids travel with the code, at the start of commit messages: [T024] or [T025 S05].
#
# Ids never change. Moving a task means changing its day. A task is never deleted: it becomes
# deferred, with a note saying where it goes.
#
# The first plan: put the project documents (spec, workshop notes, mockups) in sources/, open
# Claude Code in this directory and run /solopilot. It drafts the plan in six steps, each one
# approved by you. `solopilot layout` lays the estimated tasks out on plan days, and
# `solopilot baseline` records the agreed plan and ends the planning phase.

project:
  name: __NAME__
  phase: planning           # removed by `solopilot baseline`, once the plan is agreed
  # client: Acme          # who the project is for; requests default to them
  # owner: Alex           # you; excluded when looking for who most answers depend on
  locale: __LOCALE__        # en or fr (or a tag such as en-GB, for date formats)
  goal: "Launch"            # what happens on the target date
  start: __START__          # date of day 1
  target: __TARGET__        # the date you committed to: the core at least, everything ideally
  # budget_days: 20       # work days sold in the quote
  points_per_day: 6         # load points a full work day is worth, at the plan estimate
  focus: 0.5                # share of each working day spent on this project, for the projection
  holidays: []              # weekday dates not worked, as YYYY-MM-DD
  # plan_days and core: written by `solopilot layout`
  # working_days: [1, 2, 3, 4, 5]   # ISO weekdays worked, Monday to Friday by default
  # wip_limit: 4                    # tasks in progress before check warns
  # last_commit: abc123def456       # last project commit taken into account, written by /solopilot
  # dashboard_url: https://…        # where the dashboard is published, linked from the digest

# Optional: the order in which people appear when answers are grouped by who gives them.
people: []

sprints: []
#  - { id: 1, from: 1, to: 5, title: "First release" }

# type client: announced to the client, posted to Slack when reached.
# type checkpoint: internal checkpoint, a decision date if things slip.
milestones: []
#  - { day: 5, type: client, status: upcoming, title: "Demo to the client" }

# Meetings: the dashboard groups the answers to prepare for the next one.
meetings: []
#  - { date: 2026-01-15, title: "Workshop", with: "Acme" }

# Things you need from others. before: the plan day they are needed by. status: waiting or received.
# tasks: the tasks waiting for it (features, before the tasks exist).
dependencies: []
#  - { id: D01, before: 2, status: waiting, who: "Acme", title: "Access to the staging server", tasks: [T003] }

# Open questions. status: open or answered (with answer).
# meeting, priority, stake: the meeting where to raise it, its rank there, and what it unlocks.
questions: []
#  - { id: Q01, before: 3, status: open, who: "Acme", title: "Who can delete an account?", tasks: [T004] }

# Change requests to triage. status: pending, accepted (with tasks), declined or deferred.
requests: []
#  - { id: R01, status: pending, title: "Export to CSV", recommendation: "Accept, half a day" }

# Areas group features and tasks, like epics.
areas: []
#  - { id: accounts, title: "Accounts" }

# What the app must do, each feature traced to its source in the project documents.
# core: true for the minimum that must ship on the target date. priority: the order to build in.
# scope: out for what the documents explicitly exclude.
features: []
#  - { id: F01, area: accounts, title: "Sign-in with a magic link", source: "spec.pdf p. 4", core: true, priority: 1 }

# Typical sizes and their points, agreed before the tasks are estimated.
# basis: hypotheses, until solopilot learns from your past projects.
estimation:
  basis: hypotheses
  grid: []
#    - { kind: screen, size: "3 simple views", points: 1 }

# The plan, one entry per work day, written by `solopilot layout`. load: tight for an overloaded day.
# The optional day "later" holds what sits below the line.
days: []

# T… are tasks, S… are screens. feature: what the task delivers. points: its estimated load.
# kind: setup, logic, integration, content or release (a screen is of kind screen).
# views: the views a screen needs, by name. status: todo, doing, done (with done_on),
# blocked (with a note), deferred (with a note).
tasks: []
#  - { id: T001, feature: F01, area: accounts, kind: logic, status: todo, points: 1.5, title: "Magic link: send, expiry, single use" }
#  - { id: S01, feature: F01, area: accounts, status: todo, points: 1, views: [default, error, sending], title: "Sign-in screen" }

# One session entry per day worked (effort: share of the day spent on the project, 0 to 1),
# and one replan entry whenever the plan changes, saying why.
log: []
#  - { date: 2026-01-12, type: session, effort: 0.5, title: "Day 1 done", note: "…" }
